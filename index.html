<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEED MOTORS DMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11151b;
    --panel:#1a2027;
    --panel2:#212932;
    --line:#2b3542;
    --line-soft:#232b34;
    --text:#eef1f4;
    --text-dim:#8b98a8;
    --text-dim2:#5f6b7a;
    --amber:#f5a623;
    --amber-soft:#f5a62322;
    --teal:#48c2d6;
    --teal-soft:#48c2d622;
    --red:#e5595e;
    --red-soft:#e5595e22;
    --green:#4fbf7f;
    --green-soft:#4fbf7f22;
    --violet:#9c7bea;
    --violet-soft:#9c7bea22;
    --blue:#5b9bf5;
    --blue-soft:#5b9bf522;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{display:flex; min-height:100vh;}

  /* ===== Sidebar ===== */
  .sidebar{
    width:220px; flex-shrink:0;
    background:linear-gradient(180deg,#171d24,#12161c 80%);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:14px 4px 14px 4px;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{
    width:100%; height:auto; display:block; background:#fff; border-radius:6px; padding:2px;
  }
  .brand-sub{color:var(--text-dim); font-size:11px; margin-top:8px; letter-spacing:0.5px;}

  nav.navlist{flex:1; padding:14px 10px; overflow-y:auto;}
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:8px; cursor:pointer;
    color:var(--text-dim); margin-bottom:2px;
    transition:background .15s, color .15s;
    border:1px solid transparent;
  }
  .navitem:hover{background:var(--panel2); color:var(--text);}
  .navitem.active{
    background:var(--amber-soft); color:var(--amber);
    border-color:#f5a62344;
  }
  .navitem .ic{width:18px; text-align:center; font-size:15px;}
  .navitem .lbl{display:flex; flex-direction:column; line-height:1.25;}
  .navitem .lbl b{font-weight:700; font-size:13px;}
  .navitem .lbl small{font-size:10px; color:var(--text-dim2); font-weight:400;}
  .navitem.active .lbl small{color:#c98b2e;}

  .sidebar-foot{padding:14px 18px; border-top:1px solid var(--line); color:var(--text-dim2); font-size:10.5px; line-height:1.6;}

  /* ===== Main ===== */
  main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1400px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .pagetitle{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:24px; display:flex; align-items:center; gap:10px;}
  .pagetitle .sub{font-size:12px; font-weight:500; color:var(--text-dim); margin-left:2px;}
  .btn{
    background:var(--amber); color:#171106; border:none; font-weight:700;
    padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; gap:6px;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line); font-weight:500;}
  .btn.ghost:hover{background:var(--panel2);}
  .btn.danger{background:var(--red-soft); color:var(--red); border:1px solid #e5595e44;}
  .btn.sm{padding:6px 11px; font-size:12px;}

  /* stat cards */
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; top:0; left:0; width:3px; height:100%;
    background:var(--accent,var(--amber));
  }
  .stat-card .k{color:var(--text-dim); font-size:11.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .stat-card .v{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; color:var(--text);}
  .stat-card .v span{font-size:13px; color:var(--text-dim); font-weight:400; margin-left:4px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .panel + .panel{margin-top:16px;}
  .panel h3{margin:0 0 12px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}

  /* timeline */
  .timeline{list-style:none; margin:0; padding:0;}
  .timeline li{
    display:flex; gap:12px; padding:8px 0; border-bottom:1px dashed var(--line-soft); font-size:13px;
  }
  .timeline li:last-child{border-bottom:none;}
  .timeline .dot{width:8px;height:8px;border-radius:50%; background:var(--teal); margin-top:5px; flex-shrink:0;}
  .timeline b{color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:11px; min-width:70px; display:inline-block;}

  /* toolbar / search */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=text], .toolbar select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13px; font-family:inherit;
  }
  .toolbar input[type=text]{flex:1; min-width:180px;}
  .toolbar input:focus, .toolbar select:focus{outline:1px solid var(--amber);}
  .chip{
    padding:5px 11px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; cursor:pointer; background:var(--panel2); user-select:none;
  }
  .chip.on{background:var(--amber-soft); color:var(--amber); border-color:#f5a62355;}

  /* grid of cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; cursor:pointer; transition:border-color .15s, transform .1s;
    position:relative;
  }
  .card:hover{border-color:#f5a62366; transform:translateY(-1px);}
  .card .badge{
    position:absolute; top:12px; right:12px; font-size:10px; font-weight:700;
    padding:3px 8px; border-radius:20px; letter-spacing:.3px;
  }
  .b-stock{background:var(--blue-soft); color:var(--blue);}
  .b-nego{background:var(--amber-soft); color:var(--amber);}
  .b-sold{background:var(--red-soft); color:var(--red);}
  .b-delivered{background:var(--green-soft); color:var(--green);}
  .b-tradein{background:var(--violet-soft); color:var(--violet);}
  .mini-tag{font-size:9.5px; padding:2px 6px; border-radius:10px; font-weight:600; display:inline-block;}
  .mini-tag-img{background:var(--teal-soft); color:var(--teal);}
  .mini-tag-appr{background:var(--green-soft); color:var(--green);}

  .card .name{font-weight:700; font-size:15.5px; margin:2px 0 3px; padding-right:70px;}
  .card .meta{color:var(--text-dim); font-size:12px; margin-bottom:10px;}
  .card .price{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber); font-size:16px;}
  .card .row2{display:flex; justify-content:space-between; align-items:flex-end; margin-top:8px;}
  .card .score{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}

  .empty{
    text-align:center; color:var(--text-dim); padding:60px 20px; border:1px dashed var(--line);
    border-radius:var(--radius); font-size:13px;
  }
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:6px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:#0a0d11cc; backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
    z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    width:100%; max-width:640px; padding:0; overflow:hidden; margin-bottom:40px;
  }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
    background:var(--panel2);
  }
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
  .close-x{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;}
  .close-x:hover{color:var(--text);}

  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius:8px; font-size:13.5px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:1px solid var(--amber);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

  /* detail view */
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .detail-title{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:22px;}
  .detail-id{font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:12px; margin-top:3px;}
  .kv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px 18px; margin-bottom:6px;}
  .kv{display:flex; flex-direction:column; gap:3px;}
  .kv .k{font-size:10.5px; color:var(--text-dim2); letter-spacing:.3px;}
  .kv .v{font-size:13.5px; font-weight:600;}
  .kv .v.mono{font-family:'JetBrains Mono',monospace;}

  /* Gauge / appraisal */
  .gauge-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .dial{
    width:112px; height:112px; border-radius:50%;
    background:conic-gradient(var(--amber) calc(var(--pct,0)*1%), var(--line) 0);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .dial-inner{
    width:88px; height:88px; border-radius:50%; background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .dial-inner .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px;}
  .dial-inner .r{font-size:10px; color:var(--text-dim);}
  .segbars{display:flex; flex-direction:column; gap:8px; flex:1; min-width:220px;}
  .segrow{display:flex; align-items:center; gap:10px; font-size:12.5px;}
  .segrow .lbl{width:78px; color:var(--text-dim); flex-shrink:0;}
  .segrow .segs{display:flex; gap:3px; flex:1;}
  .seg{height:9px; flex:1; border-radius:2px; background:var(--line);}
  .seg.on{background:var(--amber);}
  .segrow .num{width:16px; text-align:right; font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:11px;}

  .defect-list{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .defect-tag{
    font-size:11.5px; background:var(--red-soft); color:var(--red); border:1px solid #e5595e33;
    padding:4px 10px; border-radius:20px;
  }
  .defect-empty{color:var(--text-dim2); font-size:12px;}

  /* Kanban */
  .kanban{display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:6px; padding-bottom:14px;}
  .kcol{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    min-width:0; display:flex; flex-direction:column; max-height:calc(100vh - 200px);
  }
  .kcol-head{
    padding:7px 6px; border-bottom:1px solid var(--line); font-weight:700; font-size:10.5px;
    display:flex; flex-direction:column; align-items:center; gap:2px; position:sticky; top:0; background:var(--panel);
    text-align:center;
  }
  .kcol-head span:first-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .kcol-head .cnt{
    font-family:'JetBrains Mono',monospace; color:var(--text-dim); background:var(--panel2);
    padding:0px 6px; border-radius:10px; font-size:10px;
  }
  .kcol-body{padding:5px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:5px;}
  .kcard{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:6px;
    cursor:pointer; font-size:10.5px;
  }
  .kcard:hover{border-color:#f5a62366;}
  .kcard .cust{font-weight:700; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kcard .veh{color:var(--text-dim); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px;}
  .kcard .mvbtns{display:flex; justify-content:space-between; gap:3px;}
  .mv{
    font-size:10px; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:3px 7px; border-radius:6px; cursor:pointer;
  }
  .mv:hover{color:var(--amber); border-color:var(--amber);}
  .kcard .mv{padding:2px 6px; font-size:11px;}
  @media (max-width:1100px){
    .kanban{overflow-x:auto; grid-auto-flow:column; grid-template-columns:repeat(9,140px);}
  }
  .lane-block{margin-bottom:24px;}
  .lane-head{
    display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px;
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .lane-head .cnt{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);
    background:var(--panel2); padding:1px 8px; border-radius:10px;
  }
  .kanban.lane .kcol{max-height:440px;}

  .staff-tag{
    font-size:10.5px; background:var(--teal-soft); color:var(--teal); padding:2px 7px; border-radius:6px; display:inline-block; margin-top:2px;
  }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#2c3540; border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .savebar{font-size:11px; color:var(--text-dim2); display:flex; align-items:center; gap:6px;}
  .savebar .dotpulse{width:6px;height:6px;border-radius:50%; background:var(--green);}

  @media (max-width:820px){
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
    .sidebar.open{transform:translateX(0);}
    main{padding:18px;}
    #menuBtn{display:inline-flex !important;}
  }
  #menuBtn{display:none; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; cursor:pointer;}
</style>
</head>

<script>
/* ============================================================
   DEED MOTORS DMS — prototype
   Data persists via window.storage (shared across all staff)
============================================================ */

let customers = [];
let vehicles = [];
let deals = [];
let staffList = [];
let currentView = 'dashboard';
let saving = false;

const STAGES = ['問い合わせ','来店','査定','試乗','見積','交渉','契約','納車','キャンセル'];
const VSTATUS = {stock:'在庫', nego:'商談中', sold:'売約済', delivered:'納車済'};
const DEFECT_OPTIONS = ['バンパー傷','フェンダー凹み','飛び石','シート汚れ','タイヤ摩耗','オイル漏れ','異音','修復歴あり','ガラス傷','塗装剥がれ'];

const NAV = [
  {id:'dashboard', ic:'🏠', ja:'ダッシュボード', mn:'Хяналтын самбар'},
  {id:'customers', ic:'👤', ja:'顧客管理', mn:'Үйлчлүүлэгч'},
  {id:'vehicles', ic:'🚗', ja:'車両・査定', mn:'Тээвэр · Үнэлгээ'},
  {id:'deals', ic:'💬', ja:'商談パイプライン', mn:'Худалдааны явц'},
  {id:'staff', ic:'👥', ja:'スタッフ管理', mn:'Ажилтан'},
  {id:'trash', ic:'🗑', ja:'ゴミ箱', mn:'Хогийн сав'},
];

/* ---------------- Mongolian on-screen keyboard ---------------- */
const MN_KEYBOARD_ROWS = [
  ['Е','Щ'],
  ['Ф','Ц','У','Ж','Э','Н','Г','Ш','Ү','З','К','Ъ'],
  ['Й','Ы','Б','Ө','А','Х','Р','О','Л','Д','П'],
  ['Я','Ч','Ё','С','М','И','Т','Ь','В','Ю']
];
let mnShift = false;
let mnLastFocusedInput = null;
document.addEventListener('focusin', function(e){
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA') && !['file','date','month','number'].includes(t.type)){
    mnLastFocusedInput = t;
  }
});
function mnKeyInsert(ch){
  const el = mnLastFocusedInput;
  if(!el || !document.body.contains(el)) return;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,start) + ch + el.value.slice(end);
  const newPos = start + ch.length;
  el.focus();
  el.setSelectionRange(newPos, newPos);
  el.dispatchEvent(new Event('input', {bubbles:true}));
}
function mnKeyBackspace(){
  const el = mnLastFocusedInput;
  if(!el || !document.body.contains(el)) return;
  let start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  if(start===end && start>0) start -= 1;
  el.value = el.value.slice(0,start) + el.value.slice(end);
  el.focus();
  el.setSelectionRange(start,start);
  el.dispatchEvent(new Event('input', {bubbles:true}));
}
function mnToggleShift(){ mnShift = !mnShift; renderMnKeyboardKeys(); }
function renderMnKeyboardKeys(){
  const el = document.getElementById('mnKeyboardKeys');
  if(!el) return;
  el.innerHTML = MN_KEYBOARD_ROWS.map(row=>`
    <div style="display:flex; gap:4px; margin-bottom:4px; flex-wrap:wrap;">
      ${row.map(ch=>{
        const disp = mnShift ? ch : ch.toLowerCase();
        return `<span class="mv" style="font-size:14px; padding:8px 10px; min-width:32px; text-align:center;" onclick="mnKeyInsert('${disp}')">${disp}</span>`;
      }).join('')}
    </div>
  `).join('') + `
    <div style="display:flex; gap:4px; margin-top:4px;">
      <span class="mv" style="padding:8px 14px; ${mnShift?'background:var(--amber-soft); color:var(--amber);':''}" onclick="mnToggleShift()">⇧ 大文字</span>
      <span class="mv" style="padding:8px 30px;" onclick="mnKeyInsert(' ')">スペース</span>
      <span class="mv" style="padding:8px 14px;" onclick="mnKeyBackspace()">⌫ 削除</span>
    </div>
  `;
}
function toggleMnKeyboard(){
  const bar = document.getElementById('mnKeyboardBar');
  const btn = document.getElementById('mnKeyboardToggleBtn');
  const showing = bar.style.display !== 'none';
  bar.style.display = showing ? 'none' : 'block';
  btn.style.display = showing ? '' : 'none';

function uid(prefix){

function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){

function fmtDate(d){

  const dt = new Date(d);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;

function stats(){
  const stock = vehicles.filter(v=>v.status==='stock').length;
  const nego = deals.filter(d=>!['契約','納車','キャンセル'].includes(d.stage)).length;
  const appraisalPending = vehicles.filter(v=>!v.appraisal || Object.values(v.appraisal).every(x=>!x)).length;
  const deliveredThisMonth = vehicles.filter(v=>v.status==='delivered' && sameMonth(v.createdAt)).length;
  const totalProfit = vehicles.filter(v=>v.status==='sold'||v.status==='delivered').reduce((s,v)=>s+((v.priceSale||0)-(v.priceCost||0)),0);
  return {stock, nego, appraisalPending, deliveredThisMonth, totalProfit, totalVehicles:vehicles.length};
}
function sameMonth(ts){
  const d=new Date(ts), n=new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
}

function sortCustomerList(list){
  const sorted = [...list];
  switch(custSort){
    case 'custom': sorted.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)); break;
    case 'old': sorted.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); break;
    case 'name': sorted.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja')); break;
    case 'deals': sorted.sort((a,b)=>deals.filter(d=>d.customerId===b.id).length-deals.filter(d=>d.customerId===a.id).length); break;
    case 'service_due': sorted.sort((a,b)=>{
      const da = a.nextServiceDate ? new Date(a.nextServiceDate).getTime() : Infinity;
      const db = b.nextServiceDate ? new Date(b.nextServiceDate).getTime() : Infinity;
      return da-db;
    }); break;
    default: sorted.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); // new
  }
  return sorted;
}

  let list = customers.filter(c => !q || (c.name+c.nameMn+c.phone+c.address).toLowerCase().includes(q));
  if(custTypeFilter!=='all') list = list.filter(c => custTypeFilter==='none' ? !c.customerType : c.customerType===custTypeFilter);
  list = sortCustomerList(list);
  return `
    <div class="topbar">
      <div class="pagetitle">👤 顧客管理 <span class="sub">${customers.length}名登録</span></div>
      <button class="btn" onclick="openCustomerForm()">＋ 新規顧客</button>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="🔍 氏名・電話番号・住所で検索…" value="${esc(custFilter)}" oninput="custFilter=this.value; renderView()">
      <select onchange='custSort=this.value; renderView()'>
        ${Object.entries(CUST_SORT_OPTIONS).map(([k,l])=>`<option value="${k}" ${custSort===k?'selected':''}>${l}</option>`).join('')}
      </select>
      ${['all','自社客','他社客','none'].map(t=>`
        <span class="chip ${custTypeFilter===t?'on':''}" onclick='custTypeFilter="${t}"; renderView()'>${t==='all'?'すべて':(t==='none'?'区分未設定':t)}</span>
      `).join('')}
    </div>
    ${list.length===0 ? `<div class="empty"><b>該当する顧客がいません</b>「＋新規顧客」から登録してください</div>` : `
    <div class="grid">
      ${list.map((c,i)=>{
        const dealCount = deals.filter(d=>d.customerId===c.id).length;
        const due = serviceDue(c.nextServiceDate);
        return `
        <div class="card" onclick="openCustomerDetail('${c.id}')">
          <div style="display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; margin-bottom:2px;">
            ${c.customerType?`<span class="badge ${customerTypeBadgeClass(c.customerType)}" style="position:static">${esc(c.customerType)}</span>`:''}
            ${due?`<span class="badge b-sold" style="position:static">🔔 点検時期</span>`:''}
          </div>
          <div class="name">${esc(c.name)}</div>
          <div class="meta">${esc(c.nameMn||'')} ${c.nameMn?'・':''}${esc(c.phone||'電話未登録')}</div>
          <div class="meta" style="margin-top:-6px;">📍 ${esc(c.address||'住所未登録')}</div>
          ${c.salesStaff?`<span class="staff-tag" style="margin-top:4px">👤 ${esc(c.salesStaff)}</span>`:''}
          ${custSort==='custom' ? `<div style="display:flex; gap:6px; margin-top:6px;">
            <span class="mv" style="${i===0?'opacity:.3; pointer-events:none;':''}" onclick="event.stopPropagation(); moveCustomer('${c.id}',${list[i-1]?`'${list[i-1].id}'`:'null'})">↑ 上へ</span>
            <span class="mv" style="${i===list.length-1?'opacity:.3; pointer-events:none;':''}" onclick="event.stopPropagation(); moveCustomer('${c.id}',${list[i+1]?`'${list[i+1].id}'`:'null'})">↓ 下へ</span>
          </div>`:''}
          <div class="row2">
            <span class="score">商談履歴 ${dealCount}件</span>
            <span class="score">登録 ${fmtDate(c.createdAt)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  `;
}

function searchLinkableVehicle(){
  const qDigits = document.getElementById('f_linksearch').value.replace(/\D/g,'');
  const resultsEl = document.getElementById('linkSearchResults');
  if(!qDigits){ resultsEl.innerHTML = ''; return; }
  const matches = vehicles.filter(v=>{
    if(v.kind!=='tradein' || v.ownerCustomerId) return false;
    const regDigits = (v.regNum||'').replace(/\D/g,'');
    return regDigits && regDigits.includes(qDigits);
  }).slice(0,5);
  if(matches.length===0){
    resultsEl.innerHTML = `<div style="font-size:11.5px; color:var(--text-dim2)">一致する未紐付けの査定車が見つかりません</div>`;
    return;
  }
  resultsEl.innerHTML = matches.map(v=>`
    <div class="card" style="padding:8px 10px; margin-bottom:6px; cursor:pointer" onclick="selectLinkVehicle('${v.id}')">
      <div style="font-weight:700; font-size:13px">${esc(v.maker)} ${esc(v.model)} ${v.year?`(${v.year})`:''}</div>
      <div class="meta" style="font-size:11px">登録番号: ${esc(v.regNum||'—')} ・ VIN: ${esc(v.vin||'—')}</div>
    </div>
  `).join('');
}
function selectLinkVehicle(vid){
  const v = vehicles.find(x=>x.id===vid);
  if(!v) return;
  linkedTradeInVehicleId = vid;
  document.getElementById('linkSearchResults').innerHTML = '';
  document.getElementById('f_linksearch').value = '';
  document.getElementById('linkSelected').innerHTML = `
    <div class="staff-tag" style="display:inline-flex; align-items:center; gap:8px; font-size:12.5px;">
      ✓ リンク予定: ${esc(v.maker)} ${esc(v.model)}（登録番号: ${esc(v.regNum||'—')}）
      <span style="cursor:pointer; color:var(--red)" onclick="unselectLinkVehicle()">✕ 解除</span>
    </div>`;
}
function unselectLinkVehicle(){
  linkedTradeInVehicleId = null;
  document.getElementById('linkSelected').innerHTML = '';
}
async function saveCustomer(id){
  const data = {
    name: document.getElementById('f_name').value.trim(),
    nameMn: document.getElementById('f_nameMn').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    fb: document.getElementById('f_fb').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    birthday: document.getElementById('f_birthday').value,
    job: document.getElementById('f_job').value.trim(),
    referrer: document.getElementById('f_referrer').value.trim(),
    salesStaff: document.getElementById('f_salesstaff').value,
    customerType: document.getElementById('f_custtype').value || null,
    nextServiceDate: document.getElementById('f_nextService').value,
    note: document.getElementById('f_note').value.trim(),
  };
  if(!data.name){ alert('氏名を入力してください'); return; }
  let c;
  if(id){
    c = customers.find(x=>x.id===id);
    Object.assign(c, data);
  }else{
    const maxOrder = customers.reduce((m,x)=>Math.max(m, x.sortOrder||0), -1);
    c = {id:uid('C'), ...data, sortOrder: maxOrder+1, createdAt:Date.now()};
    customers.push(c);
  }
  closeModal();
  renderView();
  await upsertCustomerRow(c);
  if(linkedTradeInVehicleId){
    const v = vehicles.find(x=>x.id===linkedTradeInVehicleId);
    if(v){
      v.ownerCustomerId = c.id;
      await upsertVehicleRow(v);
    }
    linkedTradeInVehicleId = null;
  }
}
async function deleteCustomer(id){
  if(!confirm('この顧客情報をゴミ箱に移動しますか？関連する商談履歴は残ります。「ゴミ箱」からいつでも復元できます。')) return;
  const c = customers.find(x=>x.id===id);
  customers = customers.filter(c=>c.id!==id);
  closeModal();
  go('customers');
  if(c){ c.deletedAt = Date.now(); await upsertCustomerRow(c); }
}

function serviceDue(dateStr){
  if(!dateStr) return false;
  const diff = (new Date(dateStr) - new Date()) / 86400000;
  return diff <= 30;
}

let vehFilter = {q:'', status:'all', sort:'new'};
const VEH_SORT_OPTIONS = {
  new:'登録が新しい順', old:'登録が古い順',
  price_high:'価格が高い順', price_low:'価格が安い順',
  year_new:'年式が新しい順', year_old:'年式が古い順',
  maker:'メーカー名順'
};
function sortVehicleList(list){
  const sorted = [...list];
  switch(vehFilter.sort){
    case 'old': sorted.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); break;
    case 'price_high': sorted.sort((a,b)=>(b.priceSale||0)-(a.priceSale||0)); break;
    case 'price_low': sorted.sort((a,b)=>(a.priceSale||0)-(b.priceSale||0)); break;
    case 'year_new': sorted.sort((a,b)=>(b.year||0)-(a.year||0)); break;
    case 'year_old': sorted.sort((a,b)=>(a.year||0)-(b.year||0)); break;
    case 'maker': sorted.sort((a,b)=>(a.maker+a.model).localeCompare(b.maker+b.model,'ja')); break;
    default: sorted.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); // new
  }
  return sorted;
}
function renderVehicles(){
  const q = vehFilter.q.trim().toLowerCase();
  let list = vehicles.filter(v => (!q || (v.maker+v.model+v.color+v.vin+(v.regNum||'')).toLowerCase().includes(q)));
  if(vehFilter.status!=='all') list = list.filter(v => (v.kind==='tradein' ? 'tradein' : v.status) === vehFilter.status);
  list = sortVehicleList(list);
  return `
    <div class="topbar">
      <div class="pagetitle">🚗 車両・査定管理 <span class="sub">${vehicles.length}台</span></div>
      <button class="btn" onclick="openVehicleForm()">＋ 新規車両登録</button>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="🔍 メーカー・車名・色・VINで検索…" value="${esc(vehFilter.q)}" oninput="vehFilter.q=this.value; renderView()">
      <select onchange='vehFilter.sort=this.value; renderView()'>
        ${Object.entries(VEH_SORT_OPTIONS).map(([k,l])=>`<option value="${k}" ${vehFilter.sort===k?'selected':''}>${l}</option>`).join('')}
      </select>
      ${['all','tradein','stock','nego','sold','delivered'].map(s=>`
        <span class="chip ${vehFilter.status===s?'on':''}" onclick='vehFilter.status="${s}"; renderView()'>${s==='all'?'すべて':(s==='tradein'?'📋 査定車':VSTATUS[s])}</span>
      `).join('')}
    </div>
    ${list.length===0 ? `<div class="empty"><b>該当する車両がありません</b>検索条件を変更するか新規登録してください</div>` : `
    <div class="grid">${list.map(v=>vehicleCardHtml(v)).join('')}</div>`}
  `;
}
function badgeClass(status){ return {stock:'b-stock', nego:'b-nego', sold:'b-sold', delivered:'b-delivered', tradein:'b-tradein'}[status]||'b-stock'; }
function vehicleCardHtml(v){
  const score = appraisalScore(v);
  const deal = dealForVehicle(v.id);
  const isTradeIn = v.kind==='tradein';
  const badgeLabel = isTradeIn ? '📋 査定車' : VSTATUS[v.status];
  const hasImage = (v.files||[]).some(f=>isImageFile(f.name));
  const hasAppraisal = (v.serviceHistory||[]).some(h=>h.category==='appraisal');
  return `
    <div class="card" onclick="openVehicleDetail('${v.id}')">
      <span class="badge ${badgeClass(isTradeIn?'tradein':v.status)}">${badgeLabel}</span>
      <div class="name">${esc(v.maker)} ${esc(v.model)}</div>
      <div class="meta">${v.year}年式 ・ ${esc(v.color)} ・ ${(v.mileage||0).toLocaleString()}km</div>
      ${(hasImage||hasAppraisal) ? `<div style="display:flex; gap:5px; margin:4px 0;">
        ${hasImage?`<span class="mini-tag mini-tag-img">🖼 画像</span>`:''}
        ${hasAppraisal?`<span class="mini-tag mini-tag-appr">✅ 査定済</span>`:''}
      </div>`:''}
      ${deal && deal.stage!=='キャンセル' ? `<div class="meta" style="color:var(--teal); margin-top:-6px">🙋 ${esc(custName(deal.customerId))} 様 ・ ${esc(deal.stage)}</div>`:''}
      <div class="row2">
        <span class="price">${fmtMoney(v.priceSale)}</span>
        <span class="score">評価 ${score}/100</span>
      </div>
    </div>
  `;
}
function appraisalScore(v){
  if(!v.appraisal) return 0;
  const vals = Object.values(v.appraisal);
  const sum = vals.reduce((a,b)=>a+(b||0),0);
  return Math.round(sum/(vals.length*5)*100);
}
function parseExternalReport(v){
  if(!v.externalReportText) return null;
  try{ return JSON.parse(v.externalReportText); }catch(e){ return null; }
}

  const rep = parseExternalReport(v);
  const veh = (rep && rep.vehicle) || {};
  const dmg = (rep && rep.damageHistory) || {};
  const mkt = (rep && rep.marketPrice) || {};
  const fin = (rep && rep.finalAppraisal) || {};
  const DAMAGE_LABEL = {none:'無', minor:'軽微あり(RA)', major:'重大あり(R)'};
  return `
    <div class="panel" style="border-color:#48c2d644">
      <h3>🔗 査定ツール診断結果（deed-motors-scraper）</h3>
      <div class="gauge-wrap" style="align-items:center; margin-bottom:14px">
        <span class="badge" style="position:static; background:var(--teal-soft); color:var(--teal); font-size:20px; padding:8px 18px; font-weight:900">${esc(v.externalGrade||'—')}</span>
        <div style="font-size:12px; color:var(--text-dim)">査定ツールでの評価グレード<br><span style="font-size:11px; color:var(--text-dim2)">こちらが正式な査定結果です</span></div>
      </div>
      <div class="kv-grid">
        <div class="kv"><span class="k">査定参考価格</span><span class="v mono" style="color:var(--amber)">${v.externalAppraisalPrice?esc(v.externalAppraisalPrice)+' сая ₮':'—'}</span></div>

// 査定ツールJSONのうち、DMSに専用入力欄が無い項目を備考欄へ整形して追記する。
// 再読み込みしても同じブロックが積み重ならないよう、マーカーで囲んだ既存ブロックは
// 差し替え前に必ず取り除く（Даавуу欄の更新バッジ蓄積バグと同種の事故を避けるため）。
const APPRAISAL_NOTE_START = '――― 査定ツール自動反映 ―――';
const APPRAISAL_NOTE_END   = '――――――――――――――――';
function buildAppraisalNoteBlock(data){
  const veh = data.vehicle || {};
  const dh  = data.damageHistory || {};
  const mkt = data.marketPrice || {};
  const fin = data.finalAppraisal || {};
  const lines = [];
  const push = (label, val) => { if(val!==undefined && val!==null && val!==''){ lines.push(`${label}: ${val}`); } };
  push('フル型式／グレード', [veh.fullModel, veh.trimGrade].filter(Boolean).join(' / '));
  push('エンジン型式', veh.engineModel);
  push('排気量', veh.displacementCc!=null ? `${veh.displacementCc}cc` : '');
  push('輸入年月', veh.importedYearMonth);
  push('点検者', veh.inspector);
  push('査定日', veh.appraisalDate);
  push('修復歴', dh.status==='none' ? '無' : (dh.status||''));
  if(Array.isArray(dh.affectedParts) && dh.affectedParts.length>0){
    push('修復歴部位', dh.affectedParts.join('、'));
  }
  if(mkt.averagePriceManMnt!=null){
    push('市場価格（参考）', `平均${mkt.averagePriceManMnt} / ${mkt.minPriceManMnt}〜${mkt.maxPriceManMnt} сая ₮（${mkt.sampleCount}件）`);
  }
  push('算出式', fin.formula);
  if(lines.length===0) return '';
  return [APPRAISAL_NOTE_START, ...lines, APPRAISAL_NOTE_END].join('\n');
}
function mergeAppraisalNote(existingNotes, block){
  const esc2 = s => s.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
  const re = new RegExp(esc2(APPRAISAL_NOTE_START) + '[\\s\\S]*?' + esc2(APPRAISAL_NOTE_END), 'g');
  const stripped = (existingNotes||'').replace(re, '').trim();
  if(!block) return stripped;
  return stripped ? `${block}\n\n${stripped}` : block;
}
// クリップボードから直接読み込む（貼り付け操作そのものを省略する）。
// 読み取れない場合はテキストエリアへの手動貼り付けにフォールバック。
async function importFromClipboard(textareaId, importFn){
  try{
    const text = await navigator.clipboard.readText();
    if(!text || !text.trim()){
      alert('クリップボードが空です。査定ツール側で「📋 結果をコピー」を押してから実行してください。');
      return;
    }
    document.getElementById(textareaId).value = text;
    importFn();
  }catch(e){
    alert('クリップボードを読み取れませんでした（ブラウザの権限設定をご確認ください）。テキストエリアに手動で貼り付けてから「JSONを読み込む」ボタンを押してください。');
  }
}
function importAppraisalJSON(){
  const raw = document.getElementById('f_importjson').value.trim();
  if(!raw){ alert('査定ツールでコピーしたJSONを貼り付けてから読み込んでください'); return; }
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ alert('JSONの形式が正しく読み取れませんでした。査定ツール側で「結果をコピー」をもう一度押してから貼り直してください。'); return; }
  const veh = data.vehicle || {};
  const score = data.score || {};
  const fin = data.finalAppraisal || {};
  let hit = 0;
  const setIf = (id, val) => {
    if(val!==undefined && val!==null && val!==''){ document.getElementById(id).value = val; hit++; }
  };
  setIf('f_maker', veh.maker);
  setIf('f_model', veh.model);
  setIf('f_year', veh.manufactureYear);
  setIf('f_color', veh.color);
  setIf('f_mileage', veh.mileageKm);
  setIf('f_vin', veh.vin);
  setIf('f_regnum', veh.registrationNumber);
  setIf('f_extgrade', score.grade);
  setIf('f_extprice', fin.referencePriceManMnt);
  const noteBlock = buildAppraisalNoteBlock(data);
  const notesEl = document.getElementById('f_notes');
  notesEl.value = mergeAppraisalNote(notesEl.value, noteBlock);
  if(noteBlock) hit++;
  document.getElementById('f_importtext').value = JSON.stringify(data, null, 2);
  alert(hit>0 ? `${hit}項目を読み込みました。内容を確認してから保存してください。` : 'JSONは読み取れましたが、対応する項目が見つかりませんでした。仕様書の項目名を確認してください。');
}

function importAppraisalJSONToTradeIn(){
  const raw = document.getElementById('ti_importjson').value.trim();
  if(!raw){ alert('査定ツールでコピーしたJSONを貼り付けてから読み込んでください'); return; }
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ alert('JSONの形式が正しく読み取れませんでした。査定ツール側で「結果をコピー」をもう一度押してから貼り直してください。'); return; }
  const veh = data.vehicle || {};
  const score = data.score || {};
  const fin = data.finalAppraisal || {};
  let hit = 0;
  const setIf = (id, val) => {
    if(val!==undefined && val!==null && val!==''){ document.getElementById(id).value = val; hit++; }
  };
  setIf('ti_maker', veh.maker);
  setIf('ti_model', veh.model);
  setIf('ti_year', veh.manufactureYear);
  setIf('ti_color', veh.color);
  setIf('ti_mileage', veh.mileageKm);
  setIf('ti_vin', veh.vin);
  setIf('ti_regnum', veh.registrationNumber);
  setIf('ti_extgrade', score.grade);
  setIf('ti_extprice', fin.referencePriceManMnt);
  const noteBlock = buildAppraisalNoteBlock(data);
  const notesEl = document.getElementById('ti_notes');
  notesEl.value = mergeAppraisalNote(notesEl.value, noteBlock);
  if(noteBlock) hit++;
  document.getElementById('ti_importjson').dataset.raw = JSON.stringify(data, null, 2);
  alert(hit>0 ? `${hit}項目を読み込みました。内容を確認してから保存してください。` : 'JSONは読み取れましたが、対応する項目が見つかりませんでした。仕様書の項目名を確認してください。');
}

async function uploadVehicleFile(vehicleId){
  const fileInput = document.getElementById('f_fileupload');
  const category = document.getElementById('f_filecategory').value;
  const files = Array.from(fileInput.files || []);
  const statusEl = document.getElementById('fileUploadStatus');
  if(files.length===0){ alert('ファイルを選択してください'); return; }
  const v = vehicles.find(x=>x.id===vehicleId);
  v.files = v.files || [];
  let okCount = 0, failCount = 0;
  for(let i=0;i<files.length;i++){
    const file = files[i];
    statusEl.textContent = `アップロード中… (${i+1}/${files.length})`;
    const safeName = file.name.replace(/[^a-zA-Z0-9_.\-]/g, '_');
    const path = `${vehicleId}/${category}/${Date.now()}_${i}_${safeName}`;
    const { error } = await sb.storage.from('vehicle-files').upload(path, file);
    if(error){ failCount++; continue; }
    const { data: urlData } = sb.storage.from('vehicle-files').getPublicUrl(path);
    v.files.push({ path, url: urlData.publicUrl, category, name: file.name, uploadedAt: Date.now() });
    okCount++;
  }
  fileInput.value = '';
  statusEl.textContent = failCount===0 ? `${okCount}件アップロードしました` : `${okCount}件成功・${failCount}件失敗しました`;
  openVehicleDetail(vehicleId);
  await upsertVehicleRow(v);
}

  await sb.storage.from('vehicle-files').remove([path]);
  const v = vehicles.find(x=>x.id===vehicleId);
  v.files = (v.files||[]).filter(f=>f.path!==path);
  openVehicleDetail(vehicleId);
  await upsertVehicleRow(v);
}
async function moveVehicleFile(vehicleId, index, dir){
  const v = vehicles.find(x=>x.id===vehicleId);
  if(!v || !v.files) return;
  const swapIndex = index+dir;

  [v.files[index], v.files[swapIndex]] = [v.files[swapIndex], v.files[index]];
  openVehicleDetail(vehicleId);
  await upsertVehicleRow(v);
}

const DEAL_LANE_NAMES = ['ドリギオン','バルダ','テムカ','エッサ'];
function dealLaneStaffList(){
  return sortedStaff().filter(s=>DEAL_LANE_NAMES.includes(s.name));
}
async function moveDealLane(id, dir){
  const list = dealLaneStaffList();
  const idx = list.findIndex(s=>s.id===id);
  const swapIdx = idx+dir;
  if(idx===-1 || swapIdx<0 || swapIdx>=list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.sortOrder||0;
  a.sortOrder = b.sortOrder||0;
  b.sortOrder = tmp;
  renderView();
  await upsertStaffRow(a);
  await upsertStaffRow(b);
}
function renderDealLaneKanban(items){
  return `
    <div class="kanban lane">
      ${STAGES.map(stage=>{
        const stageItems = items.filter(d=>d.stage===stage);
        return `
        <div class="kcol">
          <div class="kcol-head"><span>${stage}</span><span class="cnt">${stageItems.length}</span></div>
          <div class="kcol-body">
            ${stageItems.map(d=>`
              <div class="kcard" onclick="openDealDetail('${d.id}')" title="${esc(custName(d.customerId))} 様 / ${esc(vehName(d.vehicleId))} / ${esc(d.staff||'担当未設定')}">
                <div class="cust">${esc(custName(d.customerId))}</div>
                <div class="veh">${esc(vehName(d.vehicleId))}</div>
                <div class="staff-tag" style="margin-bottom:5px; font-size:9.5px; padding:1px 5px;">${esc(d.staff||'担当未設定')}</div>
                <div class="mvbtns">
                  ${stagePrev(stage)?`<span class="mv" onclick="event.stopPropagation(); moveStage('${d.id}',-1)">‹</span>`:'<span></span>'}
                  ${stageNext(stage)?`<span class="mv" onclick="event.stopPropagation(); moveStage('${d.id}',1)">›</span>`:'<span></span>'}
                </div>
              </div>
            `).join('') || `<div style="text-align:center; color:var(--text-dim2); font-size:10px; padding:12px 2px">なし</div>`}
          </div>
        </div>`;
      }).join('')}

}
function renderDeals(){
  const laneStaff = dealLaneStaffList();
  const lanes = laneStaff.map(s=>({
    id: s.id, label: staffLabel(s),
    items: deals.filter(d=>(d.staff||'').startsWith(s.name))
  }));
  const laneNames = laneStaff.map(s=>s.name);
  const others = deals.filter(d=>!laneNames.some(n=>(d.staff||'').startsWith(n)));
  return `
    <div class="topbar">
      <div class="pagetitle">💬 商談パイプライン <span class="sub">${deals.length}件</span></div>
      <button class="btn" onclick="openDealForm()">＋ 新規商談</button>
    </div>
    ${lanes.map((lane,i)=>`
      <div class="lane-block">
        <div class="lane-head">
          <span>🧑 ${esc(lane.label)}</span><span class="cnt">${lane.items.length}件</span>
          <span style="margin-left:auto; display:flex; gap:6px">
            <span class="mv" style="${i===0?'opacity:.3; pointer-events:none;':''}" onclick="moveDealLane('${lane.id}',-1)" title="上に移動">↑</span>
            <span class="mv" style="${i===lanes.length-1?'opacity:.3; pointer-events:none;':''}" onclick="moveDealLane('${lane.id}',1)" title="下に移動">↓</span>
          </span>
        </div>
        ${renderDealLaneKanban(lane.items)}
      </div>
    `).join('')}
    ${others.length ? `
      <div class="lane-block">
        <div class="lane-head"><span>🧑 その他・未設定</span><span class="cnt">${others.length}件</span></div>
        ${renderDealLaneKanban(others)}
      </div>
    ` : ''}
  `;
}
function stagePrev(stage){ const i=STAGES.indexOf(stage); return i>0; }
function stageNext(stage){ const i=STAGES.indexOf(stage); return i<STAGES.length-2; } // exclude moving into キャンセル automatically
function advanceDealStage(dealId, dir){
  const d = deals.find(x=>x.id===dealId);
  if(!d) return null;
  const i = STAGES.indexOf(d.stage);
  const ni = Math.min(STAGES.length-1, Math.max(0, i+dir));
  d.stage = STAGES[ni];
  d.history.push({date:Date.now(), note:`ステータスを「${STAGES[ni]}」に変更`});
  const v = vehicles.find(x=>x.id===d.vehicleId);
  if(v){
    if(d.stage==='契約') v.status='sold';
    else if(d.stage==='納車') v.status='delivered';
    else if(v.status==='stock') v.status='nego';
  }
  return d;
}
async function moveStage(id, dir){
  const d = advanceDealStage(id, dir);
  renderView();
  if(d) await upsertDealRow(d);
  const v = d ? vehicles.find(x=>x.id===d.vehicleId) : null;
  if(v) await upsertVehicleRow(v);
}
async function moveStageAndRefresh(dealId, vehicleId, dir){
  const d = advanceDealStage(dealId, dir);
  openVehicleDetail(vehicleId);
  if(d) await upsertDealRow(d);
  const v = vehicles.find(x=>x.id===vehicleId);
  if(v) await upsertVehicleRow(v);
}

async function saveHistoryEntry(dealId, index, returnTo){
  const d = deals.find(x=>x.id===dealId);
  if(!d) return;
  const dateStr = document.getElementById('f_histdate').value;
  const note = document.getElementById('f_histnote').value.trim();
  if(!note){ alert('内容を入力してください'); return; }
  const h = d.history[index];
  if(!h) return;
  if(dateStr){
    const old = new Date(h.date);
    const newDate = new Date(dateStr+'T00:00:00');
    newDate.setHours(old.getHours(), old.getMinutes(), old.getSeconds());

  h.note = note;
  returnFromDealEdit(returnTo);
  await upsertDealRow(d);

}

/* ============================================================
   RENDER: STAFF
============================================================ */
function staffLabel(s){ return s.role ? `${s.name}（${s.role}）` : s.name; }
function renderStaff(){
  const sorted = sortedStaff();
  return `
    <div class="topbar">
      <div class="pagetitle">👥 スタッフ管理 <span class="sub">${staffList.length}名登録</span></div>
      <button class="btn" onclick="openStaffForm()">＋ 新規スタッフ</button>
    </div>
    ${sorted.length===0 ? `<div class="empty"><b>スタッフが登録されていません</b>「＋新規スタッフ」から登録してください</div>` : `
    <div class="grid">
      ${sorted.map((s,i)=>`
        <div class="card" style="cursor:default">
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${esc(s.role||'役職未設定')}</div>
          <div class="row2" style="margin-top:10px">
            <div style="display:flex; gap:6px">
              <span class="mv" style="${i===0?'opacity:.3; pointer-events:none;':''}" onclick="moveStaff('${s.id}',-1)">↑ 上へ</span>
              <span class="mv" style="${i===sorted.length-1?'opacity:.3; pointer-events:none;':''}" onclick="moveStaff('${s.id}',1)">↓ 下へ</span>
            </div>
            <button class="btn ghost sm" onclick='openStaffForm(${JSON.stringify(s).replace(/'/g,"&#39;")})'>✎ 編集</button>
          </div>
        </div>
      `).join('')}
    </div>`}
  `;
}
async function moveStaff(id, dir){
  const sorted = sortedStaff();
  const idx = sorted.findIndex(s=>s.id===id);
  const swapIdx = idx+dir;
  if(idx===-1 || swapIdx<0 || swapIdx>=sorted.length) return;
  const a = sorted[idx], b = sorted[swapIdx];
  const tmp = a.sortOrder||0;
  a.sortOrder = b.sortOrder||0;
  b.sortOrder = tmp;
  renderView();
  await upsertStaffRow(a);
  await upsertStaffRow(b);
}
function openStaffForm(existing){
  const s = existing || {};
  showModal(`
    <div class="modal-head"><h3>${existing?'スタッフ情報を編集':'＋ 新規スタッフ登録'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>氏名</label><input id="f_staffname" value="${esc(s.name)}" placeholder="マエダ"></div>
      <div class="field"><label>役職・担当</label><input id="f_staffrole" value="${esc(s.role)}" placeholder="営業 / 査定・整備 / 社長 など"></div>
    </div>
    <div class="modal-foot">
      ${existing?`<button class="btn danger" onclick="deleteStaff('${s.id}')">削除</button>`:''}
      <button class="btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="saveStaff('${existing?s.id:''}')">保存する</button>
    </div>
  `);
}
async function saveStaff(id){
  const name = document.getElementById('f_staffname').value.trim();
  const role = document.getElementById('f_staffrole').value.trim();
  if(!name){ alert('氏名を入力してください'); return; }
  let s;
  if(id){
    s = staffList.find(x=>x.id===id);
    Object.assign(s, {name, role});
  }else{
    const maxOrder = staffList.reduce((m,x)=>Math.max(m, x.sortOrder||0), -1);
    s = {id:uid('ST'), name, role, sortOrder: maxOrder+1, createdAt:Date.now()};
    staffList.push(s);
  }
  closeModal();
  renderView();
  await upsertStaffRow(s);
}
async function deleteStaff(id){
  if(!confirm('このスタッフを削除しますか？過去の商談記録に残っている担当者名はそのまま残ります。')) return;
  staffList = staffList.filter(s=>s.id!==id);
  closeModal();
  go('staff');
  await deleteStaffRow(id);
}

/* ============================================================
   RENDER: TRASH (ゴミ箱)
============================================================ */
async function downloadBackup(btn){
  const originalLabel = btn ? btn.textContent : '';
  if(btn) btn.textContent = '⏳ 準備中…';
  try{
    const [custRes, vehRes, dealRes, staffRes] = await Promise.all([
      sb.from('customers').select('*'),
      sb.from('vehicles').select('*'),
      sb.from('deals').select('*'),
      sb.from('staff').select('*'),
    ]);
    if(custRes.error || vehRes.error || dealRes.error || staffRes.error){
      alert('バックアップの取得に失敗しました。時間をおいて再度お試しください。');
      return;
    }
    const backup = {
      exportedAt: new Date().toISOString(),
      note: 'DEED MOTORS DMS バックアップ（削除済み＝ゴミ箱内のデータも含みます）',
      customers: custRes.data,
      vehicles: vehRes.data,
      deals: dealRes.data,
      staff: staffRes.data,
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const dateStr = todayStr();
    const a = document.createElement('a');
    a.href = url;
    a.download = `deed_motors_dms_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } finally {
    if(btn) btn.textContent = originalLabel;
  }
}
async function loadAndRenderTrash(){
  const [custRes, vehRes, dealRes] = await Promise.all([
    sb.from('customers').select('*').not('deleted_at','is',null),
    sb.from('vehicles').select('*').not('deleted_at','is',null),
    sb.from('deals').select('*').not('deleted_at','is',null),
  ]);
  const trashedCustomers = (custRes.data||[]).map(rowToCustomer).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  const trashedVehicles = (vehRes.data||[]).map(rowToVehicle).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  const trashedDeals = (dealRes.data||[]).map(rowToDeal).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  const el = document.getElementById('view');
  if(!el || currentView!=='trash') return;
  el.innerHTML = `
    <div class="topbar">
      <div class="pagetitle">🗑 ゴミ箱 <span class="sub">削除した顧客・車両・商談を復元できます</span></div>
    </div>
    <div class="panel">
      <h3>👤 顧客（${trashedCustomers.length}件）</h3>
      ${trashedCustomers.length===0 ? `<div class="empty" style="padding:16px">ゴミ箱は空です</div>` : trashedCustomers.map(c=>`
        <div class="panel" style="background:var(--panel2); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div><strong>${esc(c.name)}</strong> <span class="meta">削除日時: ${fmtDate(c.deletedAt)}</span></div>
          <div style="display:flex; gap:6px">
            <button class="btn ghost sm" onclick="restoreCustomer('${c.id}')">↩ 復元</button>
            <button class="btn danger sm" onclick="permanentlyDeleteCustomer('${c.id}')">完全に削除</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      <h3>🚗 車両（${trashedVehicles.length}件）</h3>
      ${trashedVehicles.length===0 ? `<div class="empty" style="padding:16px">ゴミ箱は空です</div>` : trashedVehicles.map(v=>`
        <div class="panel" style="background:var(--panel2); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div><strong>${esc(v.maker)} ${esc(v.model)}</strong> <span class="meta">削除日時: ${fmtDate(v.deletedAt)}</span></div>
          <div style="display:flex; gap:6px">
            <button class="btn ghost sm" onclick="restoreVehicle('${v.id}')">↩ 復元</button>
            <button class="btn danger sm" onclick="permanentlyDeleteVehicle('${v.id}')">完全に削除</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      <h3>💬 商談（${trashedDeals.length}件）</h3>
      ${trashedDeals.length===0 ? `<div class="empty" style="padding:16px">ゴミ箱は空です</div>` : trashedDeals.map(d=>`
        <div class="panel" style="background:var(--panel2); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div><strong>${esc(custName(d.customerId))} 様 ・ ${esc(vehName(d.vehicleId))}</strong> <span class="meta">削除日時: ${fmtDate(d.deletedAt)}</span></div>
          <div style="display:flex; gap:6px">
            <button class="btn ghost sm" onclick="restoreDeal('${d.id}')">↩ 復元</button>
            <button class="btn danger sm" onclick="permanentlyDeleteDeal('${d.id}')">完全に削除</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
async function restoreCustomer(id){
  const { data } = await sb.from('customers').select('*').eq('id', id).maybeSingle();
  if(!data) return;
  const c = rowToCustomer(data);
  c.deletedAt = null;
  customers.push(c);
  await upsertCustomerRow(c);
  loadAndRenderTrash();
}
async function restoreVehicle(id){
  const { data } = await sb.from('vehicles').select('*').eq('id', id).maybeSingle();
  if(!data) return;
  const v = rowToVehicle(data);
  v.deletedAt = null;
  vehicles.push(v);
  await upsertVehicleRow(v);
  loadAndRenderTrash();
}
async function restoreDeal(id){
  const { data } = await sb.from('deals').select('*').eq('id', id).maybeSingle();
  if(!data) return;
  const d = rowToDeal(data);
  d.deletedAt = null;
  deals.push(d);
  await upsertDealRow(d);
  loadAndRenderTrash();
}
async function permanentlyDeleteCustomer(id){
  if(!confirm('完全に削除します。この操作は取り消せません。よろしいですか？')) return;
  await deleteCustomerRow(id);
  loadAndRenderTrash();
}
async function permanentlyDeleteVehicle(id){
  if(!confirm('完全に削除します。この操作は取り消せません。よろしいですか？')) return;
  await deleteVehicleRow(id);
  loadAndRenderTrash();
}
async function permanentlyDeleteDeal(id){
  if(!confirm('完全に削除します。この操作は取り消せません。よろしいですか？')) return;
  await deleteDealRow(id);
  loadAndRenderTrash();
}

/* ---------------- modal helpers ---------------- */
function showModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------- router ---------------- */
function renderView(){
  window.__activeVehId = window.__activeVehId; // no-op, kept for detail re-render calls
  const el = document.getElementById('view');
  if(currentView==='dashboard') el.innerHTML = renderDashboard();
  else if(currentView==='customers') el.innerHTML = renderCustomers();
  else if(currentView==='vehicles') el.innerHTML = renderVehicles();
  else if(currentView==='deals') el.innerHTML = renderDeals();
  else if(currentView==='staff') el.innerHTML = renderStaff();
  else if(currentView==='trash') { el.innerHTML = `<div class="empty">読み込み中…</div>`; loadAndRenderTrash(); }
  renderSaveBar();
}
